<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>PAP 모바일 테스트</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#102a34; color:#fff; }
    body { display:flex; justify-content:center; font-family:system-ui,sans-serif; }
    #canvas { display:block; width:min(100vw,56.25vh); height:100%; height:100dvh; touch-action:none; outline:none; }
    @supports (height:100dvh) { #canvas { width:min(100vw,56.25dvh); } }
    #status { position:fixed; inset:0; display:grid; place-content:center; text-align:center; padding:24px; background:#102a34; }
    #progress { width:240px; max-width:80vw; margin:16px auto; }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <canvas id="canvas" tabindex="0">WebGL 2를 지원하는 브라우저가 필요합니다.</canvas>
  <div id="status" role="status"><span id="message">모바일 테스트 불러오는 중…</span><progress id="progress"></progress></div>
  <noscript>JavaScript를 켜 주세요.</noscript>
  <script src="index.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');
    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(canvas.clientWidth * ratio));
      canvas.height = Math.max(1, Math.round(canvas.clientHeight * ratio));
    }
    new ResizeObserver(resizeCanvas).observe(canvas);
    resizeCanvas();
    canvas.addEventListener('touchmove', event => event.preventDefault(), {passive:false});
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    function fail(error) {
      console.error(error);
      message.textContent = '실행할 수 없습니다: ' + (error.message || error);
      progress.hidden = true;
    }
    const engine = new Engine({"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3739284,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
    const missing = Engine.getMissingFeatures({threads:false});
    if (missing.length) {
      fail('필요한 브라우저 기능: ' + missing.join(', '));
    } else {
      engine.startGame({canvas, onProgress(current,total) {
        if (total > 0) { progress.max = total; progress.value = current; }
      }}).then(() => { status.remove(); canvas.focus(); }, fail);
    }
  </script>
</body>
</html>
